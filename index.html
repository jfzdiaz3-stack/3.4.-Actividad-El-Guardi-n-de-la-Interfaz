<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>
    <div id="contenedor-bienvenida"></div>

    <form id="formulario">

        <label for="nombre">Nombre de usuario</label>
        <input type="text" id="nombre">

        <label for="color-fondo">Color de fondo</label>
        <input type="color" id="color-fondo">

        <label for="tema">Tema visual</label>
        <select id="tema">
            <option value="claro">Modo Claro</option>
            <option value="oscuro">Modo Oscuro</option>
        </select>

        <button type="submit">Guardar Preferencias</button>

        <button type="button" id="resetear">Restablecer Interfaz</button>

    </form>

    <script src="script.js"></script>

</body>

</html>
